name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version specifier: patch | minor | major | <exact version like 18.5.22>. Leave empty to use conventional commits.'
        required: false
        default: ''
      first_release:
        description: 'First release (skip looking for a prior git tag)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: serole-java25-node22-runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: serole/github-ci/actions/setup-npm@main
        with:
          registry-url: ${{ vars.NPM_REGISTRY_URL }}
          npm-token: ${{ secrets.NPM_GROUP_TOKEN }}
          scope: "@ngdx"
          publish: "true"
          publish-registry-url: ${{ vars.NPM_PUBLISH_REGISTRY_URL }}
          publish-token: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - run: npm ci

      # --- Version, Changelog, Tag, GitHub Release ---
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Unified nx release step: bumps version in package.json, generates the project
      # changelog from conventional commits since the previous ng-dijta@* tag, creates
      # the GitHub Release body, then commits and tags atomically with
      # "chore(release): publish {version} [skip ci]". Running version + changelog as one command
      # ensures the changelog walks commits BEFORE the version-bump commit exists, so
      # real feat/fix entries are visible rather than the "version bump only" placeholder.
      # --skip-publish defers npm publish to the dedicated step below (needs a built dist/).
      # GITHUB_TOKEN is required for changelog.projectChangelogs.createRelease: "github".
      - name: Nx release (version + changelog + GitHub Release)
        id: release
        env:
          SPECIFIER: ${{ inputs.specifier }}
          FIRST_RELEASE: ${{ inputs.first_release }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_ARGS=""
          [ "$FIRST_RELEASE" = "true" ] && EXTRA_ARGS="--first-release"

          # Pass an optional specifier (patch/minor/major/<exact>) before flags so
          # nx release treats it as the positional version argument.
          if [ -n "$SPECIFIER" ]; then
            npx nx release "$SPECIFIER" --skip-publish $EXTRA_ARGS
          else
            npx nx release --skip-publish $EXTRA_ARGS
          fi

      # Detect the release tag on HEAD. Nx Release tags HEAD with `ng-dijta@<version>`
      # whenever it produces a release — regardless of whether the version in
      # `projects/ng-dijta/package.json` was bumped *this* run or pre-bumped in an earlier
      # commit. Gating downstream Build + Publish on tag presence (rather than a
      # before/after version diff) ensures pre-bumped PRs still publish to Nexus.
      - name: Detect release tag on HEAD
        id: tag_check
        run: |
          TAG=$(git tag --points-at HEAD --list 'ng-dijta@*' | head -1 || true)
          if [ -n "$TAG" ]; then
            VERSION="${TAG#ng-dijta@}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Found release tag $TAG on HEAD — version $VERSION will be built and published."
          else
            echo "No ng-dijta@* tag on HEAD — Build + Publish will be skipped."
          fi

      - name: Push release commit and tag
        if: steps.tag_check.outputs.version != ''
        run: git push --follow-tags origin HEAD:main

      # Guard: fail immediately if the GitHub Release body still contains the Nx
      # "version bump only" placeholder. This catches any future regression where the
      # split version+changelog ordering creeps back in (see P1-E01 for root cause).
      # Uses curl + the GitHub REST API directly so the step works on self-hosted
      # runners that may not have the `gh` CLI installed.
      - name: Guard against placeholder release body
        if: steps.tag_check.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.tag_check.outputs.version }}"
          TAG="ng-dijta@${VERSION}"
          # URL-encode the `@` so the path doesn't break.
          TAG_ENC="${TAG/@/%40}"
          echo "Verifying release body for ${TAG}..."
          BODY=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_ENC}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('body',''))" 2>&1)
          if echo "$BODY" | grep -iqP 'version bump only.*no code changes'; then
            echo "::error::GitHub Release ${TAG} contains the placeholder body."
            echo "::error::nx release changelog failed to walk real commits."
            echo "::error::See .github/workflows/release.yml and progress/plans/phase-1/P1-E01-release-changelog-fix.md"
            exit 1
          fi
          echo "Release body OK."

      # --- Build & Publish to Nexus ---

      # Build the library (ng-packagr) and bundle the SCSS theme. This runs after the
      # git push so the built artefacts reflect the tagged commit.
      - name: Build ng-dijta
        if: steps.tag_check.outputs.version != ''
        run: |
          npx nx build ng-dijta --configuration=production
          node scripts/patch-dist-webpack.js
          npm run build:scss

      # Publish the built dist/ to the private Nexus npm registry. The registry URL and
      # auth token are injected by setup-npm above.
      - name: Publish @ngdx/dijta
        if: steps.tag_check.outputs.version != ''
        run: npm publish ./dist/ng-dijta

