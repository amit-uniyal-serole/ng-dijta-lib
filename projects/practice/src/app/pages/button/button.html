<div class="container-fluid">
    <div class="row mt-3">
        <div class="col-md-12">
            <h3 class="heading-6">Button</h3>
        </div>
        <div class="col-md-2">
           <dx-button title="Primary"></dx-button>
        </div>
        <div class="col-md-2">
            <dx-button class="secondary-btn" title="Secondary"></dx-button>
        </div>
        <div class="col-md-2">
            <dx-button title="Primary Disabled" [disabled]="true"></dx-button>
        </div>
        <div class="col-md-2">
            <dx-button [class]="'secondary-btn'" title="Secondary Disabled" [disabled]="true"></dx-button>
        </div>
        <div class="col-md-2">
            <dx-button title="Mutli Action" [multiActionDropDown]="true" ></dx-button>
        </div>
    </div>
</div>
