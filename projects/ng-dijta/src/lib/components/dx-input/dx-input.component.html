<div class="ngdx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline" [class.display-view]="viewOnly"
  [class.dx-disable]="isDisabled" [class.left-align-label]="labelPosition === 'left'" floatLabel="never"
  [class.required]="required || ctrRequired" [class]="outerLabelErrorType" [class.none-border]="noneBorder"
  [class.readonly]="readonly">

  <mat-label class="dx-outer-label">
    <span class="dx-outer-label d-flex align-items-center">
      <ng-content select="[dxLabel]"></ng-content>
      <span *ngIf="required || ctrRequired" class="astrict">*</span>
    </span>
  </mat-label>

  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label *ngIf="outline !== 'outer-label'">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <span matPrefix>
      <ng-content select="dx-prefix"></ng-content>
    </span>
    <input dxNoLeadingTrailingSpaces  [dxTrimInput]="applyTrim" [tabIndex]="tabIndex" [id]="id" [type]="type" matInput mask="{{mask}}"
      [patterns]="maskingPatterns" [formControl]="control" (ngModelChange)="inputChange($event)" (blur)="onBlur($event)"
      [readonly]="readonly || viewOnly || isDisabled" [minlength]="minLength" [maxlength]="maxLength"
      [required]="required || ctrRequired" [placeholder]="tooltip" dxEnterKey
      [dropSpecialCharacters]="dropSpecialCharacters" (enterKeyPressed)="onEnter.emit()"
      (change)="onInputChangeEvent($event)" />

    <!-- auto complete -->
    <span matSuffix *ngIf="isCurrency && currencyPosition === 'right'">
      <span class="mx-1"> {{ currencySymbol }}</span>
    </span>
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>

    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>

    <mat-error>
      <span *ngIf="control?.errors?.['NoleadingTrailingSpaces']" class="space-error">{{ 'Please remove any extra spaces
        from the start or end of your input.' }}</span>
      <ng-content select="dx-error"></ng-content>
    </mat-error>
  </mat-form-field>
</div>
