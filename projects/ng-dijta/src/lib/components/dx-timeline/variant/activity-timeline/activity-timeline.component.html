<div class="position-relative v3-timeline" infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollThrottle]="50"
  (scrolled)="onScroll()" [scrollWindow]="false" [style.height]="height">
  <dx-timeline>
    <ng-container *ngFor="let timeline of timelinesItems">
      <dx-timeline-item [dxDot]="dotPint" [dxColor]="'transprant'" [backgroundNone]="true"></dx-timeline-item>
      <ng-template #dotPint>
        <div class="parent">
          <p class="body mb-0 fw-medium">{{timeline?.label | transloco}}</p>
        </div>
      </ng-template>
      <ng-container *ngFor="let record of timeline?.timelines">
        <dx-timeline-item [dxDot]="v3ContentDot" [dxLabel]="v3label" [backgroundNone]="true">
          <div class="v3-content">
            <div class="v3-content-header">
              <ng-container *ngIf="record?.owner">
                <div class="avatar-owner">
                  <ndx-avatar [name]="record?.owner" [avatarSettings]="avatarSettings"></ndx-avatar>
                <div class="mx-1"></div>
                <h3 dx-popover [dxPopoverContentContext]="{$implicit: record}"
                  [dxPopoverTitleContext]="{$implicit: record}" [dxHeader]="record?.ownerPopoverConfig?.header"
                  [dxPopoverTitle]="titleTemplateRef" [dxPopoverContent]="templateRef"
                  [dxPopoverTrigger]="record?.ownerPopoverConfig?.isShow && record?.ownerPopoverConfig?.popover?.trigger"
                  *ngIf="record?.owner" class="subbody mb-0 fw-bold me-1 mt-2 owner">{{record.owner | transloco}}</h3>
                </div>
                
              </ng-container>
              <h3 class="paragraph mb-0 action activity-action" [ngClass]="{
                'activity-action-created': record?.action === 'CREATED',
                'activity-action-linked' : record?.action === 'LINKED',
                'activity-action-unlinked' : record?.action === 'UNLINKED',
                'activity-action-updated' : record?.action === 'UPDATED',
                'activity-action-tagAdded' : record?.action === 'TAG_ADDED',
                'activity-action-tagRemoved' : record?.action === 'TAG_REMOVED' }">{{record.action}}</h3>
               
            </div>
            <div class="mt-1 subbody p-2" [ngClass]="{'desktop-screen': [null,undefined,''].includes(record?.displayContent)}" [innerHTML]="record?.displayContent"></div>
            <div class="subbody py-1 px-2 mobile-screen" [ngClass]="{'datetime-bordertop': ![null,undefined,''].includes(record?.displayContent)}">
                <span class="record-datetime">{{record?.activityDateTime}} at {{record?.displayTime}}</span>
            </div>
          </div>
        </dx-timeline-item>
        <ng-template #v3ContentDot>
          <div class="v3-content-icon activity-action" [ngClass]="{
              'activity-action-created': record?.action === 'CREATED', 
              'activity-action-linked' : record?.action === 'LINKED',
              'activity-action-unlinked' : record?.action === 'UNLINKED',
              'activity-action-updated' : record?.action === 'UPDATED' }">
            <mat-icon>
              {{record?.iconClass}}
            </mat-icon>
          </div>
        </ng-template>
        <ng-template #v3label>
          <div class="v3label desktop-screen">
            <p class="subbody mb-0 fw-medium">{{record?.displayTime}}</p>
            <small>{{record?.activityDateTime}}</small>
          </div>
        </ng-template>
      </ng-container>
    </ng-container>
  </dx-timeline>
</div>




<ng-template #titleTemplateRef let-popoverTitleConfig>
  <dx-popover-variant-wrapper section="HEADER" popoverConfigName="ownerPopoverConfig"
    [popoverTitleConfig]="popoverTitleConfig" (onPopoverAction)="sendDetailData($event)"></dx-popover-variant-wrapper>
</ng-template>


<ng-template #templateRef let-popoverContent>
  <dx-popover-variant-wrapper section="CONTENT" popoverConfigName="ownerPopoverConfig"
    [popoverContent]="popoverContent"></dx-popover-variant-wrapper>
</ng-template>
