<div class="ngdx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline" [class.display-view]="viewOnly"
    [class.dx-disable]="disabled" [class.left-align-label]="labelPosition==='left'"
    [class.required]="required || ctrRequired" [class]="outerLabelErrorType">
    <mat-label class="dx-outer-label" *ngIf="outline === 'outer-label'">
        <span class="dx-outer-label d-flex align-items-center">
            <ng-content select="[dxLabel]"></ng-content>
            <span *ngIf="required || ctrRequired" class="astrict">*</span>
        </span>
    </mat-label>
    <mat-form-field appearance="outline" floatLabel='always'>
        <mat-label *ngIf="outline !== 'outer-label'">
            <ng-content select="dx-label"></ng-content>
        </mat-label>
        <span matPrefix>
            <div>
                <ng-content select="dx-prefix"></ng-content>
            </div>
        </span>
        <lat-long-input [tabIndex]="tabIndex" [formControl]="control" (ngModelChange)="inputChange($event)"
            [readonly]="readonly || viewOnly || disabled" [required]="required || ctrRequired" [disabled]="disabled"
            [placeholder]="tooltip"></lat-long-input>
        <span matSuffix>
            <ng-content select="dx-suffix"></ng-content>
        </span>
        <mat-hint>
            <ng-content select="dx-hint"> </ng-content>
        </mat-hint>
        <mat-error>
            <ng-content select="dx-error"></ng-content>
        </mat-error>
    </mat-form-field>
</div>
