<ng-container *ngIf="data?.variant === '2';else variant2Ref">
    <span class="d-flex align-items-center">
        <dx-toggle *ngIf="!data?.checkBoxConfig?.hideCheckBox" [(ngModel)]="data.value" [disabled]="data?.checkBoxConfig?.disable">
        </dx-toggle>
        <dx-label *ngIf="data?.checkBoxConfig?.displayLabel">
            <ng-template
                *ngTemplateOutlet="checkBoxLabelRef; context:{config:data?.checkBoxConfig, value:data.value}"></ng-template>
        </dx-label>
    </span>
</ng-container>
<ng-template #variant2Ref>
    <span class="d-flex align-items-center">
        <dx-label *ngIf="data?.checkBoxConfig">
            <ng-template
                *ngTemplateOutlet="checkBoxLabelRef; context:{config:data?.checkBoxConfig, value:data.value}"></ng-template>
        </dx-label>
    </span>
</ng-template>

<ng-template #checkBoxLabelRef let-value="value" let-config="config">
    <ng-container [ngSwitch]="value">
        <ng-container *ngSwitchCase="true">
            {{data?.checkBoxConfig?.trueAs ?? 'True'}}
        </ng-container>
        <ng-container *ngSwitchCase="false">
            {{data?.checkBoxConfig?.falseAs ?? 'False'}}
        </ng-container>
    </ng-container>
</ng-template>
