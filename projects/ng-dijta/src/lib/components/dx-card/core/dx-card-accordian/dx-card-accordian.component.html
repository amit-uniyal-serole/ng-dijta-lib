<div class="dx-card-generic">
  <div class="dx-card-generic-header">
    <div (click)="toggleContent()" class="d-flex align-items-center cursor-pointer">
      <div class="d-flex" [@rotatedState]="collapsed">
        <mat-icon>
          expand_more
        </mat-icon>
      </div>
      <h3 *ngIf="title" class="subtitle">{{title | transloco}}</h3>
    </div>
    <!-- BASIC BUTTON -->
    <div [matTooltip]="action?.tooltip??null" class="d-flex align-items-center cursor-pointer"
      (click)="onActionClick(action?.type)" *ngIf="action?.buttonType !== 'dx-button'">
      <span class="body acc-action-label" *ngIf="action?.label"><span class="fw-semibold"
          [ngStyle]="applyClr(action?.color)">{{action?.label}}</span></span>
      <span [ngStyle]="applyClr(action?.color)" *ngIf="action?.icon"
        class="material-icons-outlined custom-accordian-action-icon">
        {{action?.icon}}
      </span>
    </div>

    <!-- DX-BUTTON -->
    <div class="d-flex align-items-center cursor-pointer" *ngIf="action?.buttonType === 'dx-button'">
      <dx-button [disabled]="action?.dxButtonConfig?.disabled" [src]="action?.dxButtonConfig?.src"
        [multiActionDropDown]="action?.dxButtonConfig?.multiActionDropDown" [title]="action?.label"
        [icon]="action?.icon" [size]="action?.dxButtonConfig?.size"
        [confirmationPopover]="action?.dxButtonConfig?.confirmationPopover"
        [isLoading]="action?.dxButtonConfig?.isLoading" [loaderType]="action?.dxButtonConfig?.loaderType"
        (onActionSelect)="onActionClick(action?.type)" (onClickMenuAction)="onActionClick($event)"></dx-button>
    </div>

  </div>
  <div class="dx-card-generic-body body" [@collapse]="collapsed">
    <ng-content></ng-content>
  </div>
</div>
