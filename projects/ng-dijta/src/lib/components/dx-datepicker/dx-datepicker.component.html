<div class="ngdx-field-wrapper dx-datepicker-aligment" [class.none-label]="noneLabel" [ngClass]="outline"
  [class.display-view]="viewOnly" [class.dx-disable]="disabled" [class.left-align-label]="labelPosition === 'left'"
  floatLabel="never" [class.required]="required || ctrRequired" [class]="outerLabelErrorType"
  [class.none-border]="noneBorder" [class.readonly]="readonly">
  <mat-label class="dx-outer-label">
    <span class="dx-outer-label d-flex align-items-center">
      <ng-content select="[dxLabel]"></ng-content>
      <span *ngIf="required || ctrRequired" class="astrict">*</span>
    </span>
  </mat-label>

  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label *ngIf="outline !== 'outer-label'">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <span matPrefix>
      <ng-content select="dx-prefix"></ng-content>
    </span>
    <input [tabIndex]="tabIndex" [id]="id" [ngModel]="value" (ngModelChange)="dataChange($event)"
      [required]="required || ctrRequired" [datePickerFormat]="format" matInput [max]="maxDate" [min]="minDate"
      [matDatepicker]="datepicker" [matTooltip]="tooltip" [matTooltipDisabled]="!tooltip" matTooltipPosition="above"
      placeholder="{{readonly? '' : ('Choose a date' | transloco)}}" [readonly]="readonly || viewOnly || disabled" />
    <mat-datepicker-toggle [tabIndex]="tabIndex" matIconSuffix matSuffix [for]="datepicker"
      [disabled]="disabled || readonly">
      <span class="material-icons" matDatepickerToggleIcon>
        event
      </span>
    </mat-datepicker-toggle>
    <mat-datepicker #datepicker>
    </mat-datepicker>
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-error>
      <ng-content select="dx-error"> </ng-content>
    </mat-error>
  </mat-form-field>

</div>
