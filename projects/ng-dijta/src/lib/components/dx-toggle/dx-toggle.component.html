<div id="dxToggle" class="dxSlideToggle">
  <div *ngIf="!labelTouchSensitive; else withLabel" class="custom-toggle">
    <mat-slide-toggle [id]="id" class="toggle-margin" [(ngModel)]="value" [labelPosition]="labelPosition"
      (ngModelChange)="inputChange($event)" [checked]="checked" [disabled]="disabled || readonly">
    </mat-slide-toggle>
    <div class="dx-input-label">
      <ng-content select=".outLabel"></ng-content>
    </div>
  </div>
  <ng-template #withLabel>
    <mat-slide-toggle [tabIndex]="tabIndex" [id]="id" class="toggle-margin" [(ngModel)]="value" [labelPosition]="labelPosition"
      (ngModelChange)="inputChange($event)" [checked]="checked" [disabled]="disabled || readonly">
      <div class="subtitle">
        <ng-content select="dx-label"></ng-content>
      </div>
    </mat-slide-toggle>
  </ng-template>

  <mat-error>
    <div class="dx-error">
      <ng-content select="dx-error"> </ng-content>
    </div>
  </mat-error>
</div>
