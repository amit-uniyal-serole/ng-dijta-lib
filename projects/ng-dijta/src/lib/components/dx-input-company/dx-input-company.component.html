<div class="ngdx-field-wrapper input-variant-layout" [class.none-label]="noneLabel" [ngClass]="outline"
  [class.display-view]="viewOnly" [class.required]="required || ctrRequired">
  <mat-label class="dx-outer-label" *ngIf="outline === 'outer-label'">
    <ng-content select="[dxLabel]"></ng-content>
    <span *ngIf="required || ctrRequired" class="astrict">*</span>
  </mat-label>
  <mat-form-field appearance="outline" floatLabel="always">
    <span matPrefix class="material-icons-outlined">{{icon}}</span>
    <mat-label *ngIf="outline !== 'outer-label'">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <input type="text" matInput [mask]="mask" [formControl]="control" [placeholder]="placeholder"
      (ngModelChange)="inputChange($event)" [disabled]="disabled" (blur)="onBlur($event)"
      [readonly]="readonly || viewOnly" />
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-error>
      <ng-content select="dx-error"> </ng-content>
    </mat-error>
  </mat-form-field>

</div>
