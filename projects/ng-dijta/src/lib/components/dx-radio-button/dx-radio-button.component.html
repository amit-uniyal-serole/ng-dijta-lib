<div class="ngdx-field-wrapper">
  <div class="radio-button-wrapper" [class.display-view]="viewOnly">
    <mat-label class="subbody" >
      <ng-content select="dx-label" class="fw-normal"></ng-content>
    </mat-label>
    <mat-radio-group [id]="id" [ngClass]="displayType == 'vertical' ? 'dx-radio-vertical' : 'dx-radio-horizantal'"
      [formControl]="control?.control" [required]="required" (ngModelChange)="inputChange($event)"
      (change)="onOptionSelect($event)" [disabled]="disabled">
      <ng-container *ngFor="let option of options">
        <mat-radio-button [value]="option?.keyTt"
          *ngIf="option?.permission ? (option?.permission?.permission | ablePure: option?.permission?.apiName | async) : true">
          <div>
            <span class="radio-label-inner"> {{option?.valueTt | transloco}}</span>
          </div>
          <div *ngIf="option?.subtitle" class="radio-option-subtitle ">
            <span class="paragraph m-0 fw-semibold">{{option?.subtitle | transloco}}</span>
          </div>
        </mat-radio-button>
      </ng-container>

    </mat-radio-group>
    <div class="mat-mdc-form-field-subscript-wrapper">
      <mat-error *ngIf="control?.errors?.required && control?.touched" class="mx-2">
        <ng-content select="dx-error"></ng-content>
      </mat-error>
    </div>
  </div>
</div>
