<div class="dx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline" [class.display-view]="viewOnly"
  [class.dx-disable]="disabled" [class.left-align-label]="labelPosition === 'left'" floatLabel="never"
  [class.required]="required || ctrRequired" [class]="outerLabelErrorType">
  <mat-label class="dx-outer-label-wrapper">
    <span class="dx-outer-label">
      <ng-content select="[dxLabel]"></ng-content>
      <span *ngIf="required || ctrRequired" class="astrict">*</span>
    </span>
  </mat-label>
  <mat-form-field appearance="outline">
    <mat-label class="dx-input-label">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <span matPrefix>
      <span class="material-icons dx-input-icon">
        account_circle
      </span>
    </span>
    <input matInput [formControl]="control" (ngModelChange)="inputChange($event)" [required]="required || ctrRequired"
      (blur)="onBlur($event)" [readonly]="readonly || viewOnly || disabled" />
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-error>
      <span *ngIf="control.errors?.pattern">{{control.errors?.pattern?.actualValue}} {{'not valid' | transloco}}</span>
      <ng-content select="dx-error"></ng-content>
    </mat-error>
  </mat-form-field>

</div>
