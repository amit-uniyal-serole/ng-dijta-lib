<div class="ngdx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline" [class.display-view]="viewOnly"
[class.dx-disable]="disabled" [class.left-align-label]="labelPosition==='left'" floatLabel="never" [class.required]="required"
[class]="outerLabelErrorType" [class.none-border]="noneBorder" [class.readonly]="readonly">
    <mat-label class="dx-outer-label">
        <span class="dx-outer-label d-flex align-items-center">
            <ng-content select="[dxLabel]"></ng-content>
            <span *ngIf="required" class="astrict">*</span>
        </span>
    </mat-label>
    <mat-form-field appearance="outline" floatLabel="always">
        <mat-label *ngIf="outline !== 'outer-label'">
            <ng-content select="dx-label"></ng-content>
        </mat-label>
        <span matPrefix>
                <ng-content select="dx-prefix"></ng-content>
        </span>
        <input matInput #t="matTimepicker" [id]="id" [ngModel]="value" ngDefaultControl matTimepicker [mode]="mode"
            [okLabel]="okLabel" [cancelLabel]="cancelLabel" [color]="color"
            [disableDialogOpenOnClick]="disableDialogOpenOnClick" [strict]="strict" [minDate]="_minDate"
            [maxDate]="maxDate" (ngModelChange)="inputChange($event)"
            [anteMeridiemAbbreviation]="anteMeridiemAbbreviation" [postMeridiemAbbreviation]="postMeridiemAbbreviation"
            (blur)="onBlur($event)" [required]="required" readonly>
        <mat-icon [class.dx-disable]="disabled" matSuffix (click)="t.showDialog()">access_time</mat-icon>
        <span matSuffix>
            <ng-content select="dx-suffix"></ng-content>
        </span>
        <mat-hint>
            <ng-content select="dx-hint"> </ng-content>
        </mat-hint>

        <mat-error>
            <ng-content select="dx-error"></ng-content>
        </mat-error>
    </mat-form-field>
</div>
