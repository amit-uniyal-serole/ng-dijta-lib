<button
  [attr.id]="id"
  class="ngx-btn ngx-btn-{{ bsStyle }} ngx-btn-{{ bsSize }} ngx-btn-{{ bsPosition }}"
  [class.ngx-btn-circle]="shape === 'circle'"
  [type]="type"
  [disabled]="disabled"
  [class.bordered]="bordered"
  [class.mouseDown]="isMouseDown"
  [backdrop]="true"
  dLoading
  [showLoading]="showLoading"
  [loadingTemplateRef]="loadingTemplateRef"
  [ngStyle]="{ width: width }"
  [dAutoFocus]="autofocus"
  (click)="onClick($event)"
  [ngClass]="{ 'd-btn-icon': !!icon && !hasContent(), 'd-btn-icon-wrap': !!icon }"
  (mousedown)="isMouseDown = true"
  (mouseup)="isMouseDown = false"
>
  <mat-icon *ngIf="!!icon" class="ngx-icon-fix icon" [ngClass]="{ 'clear-right-8': hasContent() }">{{icon}}</mat-icon>
  <!--
  --><span class="button-content" [class.ngx-btn-more-text-omits]="width !== undefined" #buttonContent><ng-content></ng-content></span>
  <div class="ngx-button-water-wave" *ngIf="showWave" [ngStyle]="{ top: waveTop + 'px', left: waveLeft + 'px' }"></div>
</button>
