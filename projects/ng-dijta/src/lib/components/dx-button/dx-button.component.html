<div *ngIf="multiActionDropDown?.show && multiActionDropDown?.menuList?.length>0; else showDefaultBtn"
  class="multi-action-wrapper">
  <button *ngIf="title" [id]="id" [class.border-radius]="isListEmpty" [dxConditionClass]="data" [condition]="condition"
    dx-popover [dxHeader]="confirmationPopover?.header" [dxPopoverContent]="confirmationPopover?.content?.message"
    [dxPopoverTrigger]="confirmationPopover?.isShow ? 'click' : ''" [dxActionButton]="confirmationPopover?.actions"
    [dxPopoverPlacement]="confirmationPopover?.popoverPlacement" (sendDetailData)="click()" appPreventDoubleClick
    mat-flat-button [ngClass]="customClass ? customClass : 'dxBtn'" [class.btn-small]="size==='small'" [class.btn-big]="size==='big'"
    (throttledClick)="!confirmationPopover?.isShow ? click() : ''" class="dx-btn-outline body  btn-pointer primaryBtn"
    [class.dxBtn]="class === 'dxBtn'"
    [class.secondary-btn]="class === 'secondary-btn'"
    [class.dxIconClass]="class === 'dxIconClass'"
     [type]="class === 'dxBtn' ? 'submit': 'button'"
    [disabled]="!(permission ? (permission?.permission | ablePure: permission?.apiName | async) : true) || disabled || isLoading">
    <ng-container *ngTemplateOutlet="dxBtnLoaders"></ng-container>
    <span class="no-permission-btn"
      *ngIf="!(permission ? (permission?.permission | ablePure: permission?.apiName | async) : true)"><svg width="20px"
        height="20px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="#000000">
        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
        <g id="SVGRepo_iconCarrier">
          <path class="error"
            d="M8 .262S6.364 3 2 3c0 9.31 6 12.594 6 12.594S14 12.31 14 3C9.636 3 8 .262 8 .262zm0 1.386c.272.312.257.42.781.795.912.654 2.362 1.19 4.153 1.391-.174 3.943-1.439 6.642-2.73 8.352-.982 1.298-1.74 1.878-2.204 2.193-.463-.315-1.222-.895-2.203-2.193-1.292-1.71-2.557-4.409-2.73-8.352 1.79-.2 3.24-.737 4.152-1.39.524-.377.51-.483.781-.796zM7 4v3l.5 2h1L9 7V4zm1 6a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"
            style="marker:none" color="#000000" overflow="visible" fill="#f22c42"></path>
        </g>
      </svg></span>
    <span class="dx-btn-mat-icons material-icons" *ngIf="icon">{{icon}}</span>
    <img [src]="src" class="bottom-icon" *ngIf="src" alt="img">{{title | transloco}}
  </button>

  <button [id]="id" [class.hidden]="isListEmpty" #dropDownToggle [dxConditionClass]="data" [condition]="condition"
    mat-flat-button  [ngClass]="customClass ? customClass : 'dxBtn'" [class.btn-small]="size==='small'" [class.btn-big]="size==='big'"
    (keyup.enter)="toggleMultiActonMenu()" (click)="toggleMultiActonMenu()"
    class="dx-btn-outline btn-pointer multi-action-menu body" [class.dxBtn]="class === 'dxBtn'"
    [class.secondary-btn]="class === 'secondary-btn'"
    [class.dxIconClass]="class === 'dxIconClass'"
    
    [disabled]="multiActionDropDown?.disable" [type]="class === 'dxBtn' ? 'submit': 'button'"
    [class.is-only-dropdown]="multiActionDropDown?.isOnlyDropdown">
    <span class="d-flex align-items-center">
      <span #dropDownLabel *ngIf="multiActionDropDown?.label"
        class="multi-action-dropdown-label">{{multiActionDropDown?.label | transloco}}</span>
      <span #dropDownIcon class="material-icons-outlined dx-btn-multi-action-icon">
        arrow_drop_down
      </span>
    </span>
  </button>

  <div #multiActonMenu [class.hidden]="isMultiActionDropdownOpen" id="multiActionPanel" class="multi-action-panel">
    <div #subaction>
      <ng-container *ngFor="let item of multiActionDropDown?.menuList;let index = i">
        <ng-container
          *ngIf="item?.permission ? (item.permission?.permission | ablePure: item.permission?.apiName | async) : true">
          <button mat-flat-button [id]="item?.id ?  item.id: id + '-'+ i" [dxConditionClass]="data"
            [condition]="item?.classCondition" [class.btn-small]="size==='small'" [class.btn-big]="size==='big'"
            dx-tooltip dxTooltipTitle="{{item?.label}}" dxTooltipPlacement="left" [disabled]="item?.disable"
            class="dx-btn-outline menu-btns body" (click)="multiActionMenuClick(item?.event, item?.confirmationPopover)"
            (keyup.enter)="multiActionMenuClick(item?.event, item?.confirmationPopover)">
            <div class="dx-multi-btn-icon">
              <span class="material-icons-outlined action-icons" [ngStyle]="fillLabelColor(item?.color)"
                *ngIf="item?.icon">{{item?.icon}}</span>
              <img [src]="item?.src" class="bottom-icon" *ngIf="item?.src" alt="img">
              <span class="multi-action-items" [ngStyle]="fillLabelColor(item?.color)">{{item?.label |
                transloco}}</span>
            </div>
          </button>
        </ng-container>

      </ng-container>
    </div>

  </div>
</div>
<ng-template #showDefaultBtn>
  <button *ngIf="title || icon || src" dx-popover [id]="id" [dxHeader]="confirmationPopover?.header" [dxConditionClass]="data"
    [condition]="condition" [dxPopoverContent]="confirmationPopover?.content?.message"
    [ngClass]="customClass ? customClass : 'dxBtn col'"
    [class]="class"
    [dxPopoverTrigger]="confirmationPopover?.isShow ? 'click' : ''" [dxActionButton]="confirmationPopover?.actions"
    [dxPopoverPlacement]="confirmationPopover?.popoverPlacement" (sendDetailData)="click()"
    [class.btn-small]="size==='small'" [class.btn-big]="size==='big'" appPreventDoubleClick mat-flat-button
    (throttledClick)="!confirmationPopover?.isShow ? click() : ''" class="dx-btn-outline body btn-pointer"
    [class.dxBtn]="class === 'dxBtn'"
    [class.secondary-btn]="class === 'secondary-btn'"
    [class.dxIconClass]="class === 'dxIconClass'"
     [type]="class === 'dxBtn' ? 'submit': 'button'"
    [disabled]="!(permission ? (permission?.permission | ablePure: permission?.apiName | async) : true) || (disabled || isLoading)"
    [class.dx-button-column-reverse]="isReverseElement">
    <ng-container *ngTemplateOutlet="dxBtnLoaders"></ng-container>
    <span class="dx-btn-mat-icons material-icons" *ngIf="icon">{{icon}}</span>
    <img [src]="src" class="bottom-icon" *ngIf="src" alt="img">{{title | transloco}}
    <ng-content select="dx-button-template"></ng-content>
  </button>
</ng-template>

<ng-template #dxBtnLoaders>
  <!-- Loaders -->
  <span *ngIf="isLoading && loaderType==='semi-circle'" class="dx-btn-loader semi-circle"></span>
  <span *ngIf="isLoading && loaderType==='arc'" class="dx-btn-loader arc"></span>
  <span *ngIf="isLoading && loaderType==='dual-arc'" class="dx-btn-loader dual-arc"></span>
  <span *ngIf="isLoading && loaderType==='pulse'" class="dx-btn-pulse"></span>
  <span *ngIf="isLoading && loaderType==='refresh'" class="dx-btn-refresh"></span>
  <!--  -->
</ng-template>
