<div class="dx-notification-item" [id]="id">

    <div class="dx-notification-avatar" *ngIf="data?.userName">
        <ndx-avatar [name]="data?.userName | transloco"></ndx-avatar>
    </div>
    <div class="dx-notification-message">
        <h3 class="body fw-semibold mb-0" *ngIf="data?.title">{{data?.title}}</h3>
        <div class="message-area">
            <div class="body mb-0" *ngIf="data?.message" [innerHtml]="data?.message | transloco">
            </div>
            <div class="isRead" [id]="id+'-'+'markread'" [class.un-read]="data?.isRead" (click)="markMessageAsRead()">
            </div>
        </div>
        <span class="date-time subbody">{{data?.date}}</span>
    </div>
</div>
