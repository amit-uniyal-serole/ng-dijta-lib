<div class="uploader-wrapper">
  <dx-awesome-uploader #uploader [uploadType]="uploadType" [fileMaxSize]="fileMaxSize" [enableCropper]="enableCropper"
    [totalMaxSize]="totalMaxSize" [fileMaxCount]="fileMaxCount" [cropperOptions]="cropperOptions"
    (fileRemoved)="onRemoveSuccess($event)" (fileAdded)="onFileAdded($event)" [adapterData]="adapterData"
    [enableAutoUpload]="enableAutoUpload" [accept]="accept" [fileTypes]="fileTypes">
    <div class="dropzoneTemplate h-100">
      <div class="dx-image-upload-v1">
        <div class="drag-drop-content">          
          <mat-icon aria-hidden="false" aria-label="Upload Icon" fontIcon="cloud_upload"></mat-icon>          
          <p class="content body">{{ 'Drag and Drop files to upload' | transloco }}</p>
          <p>{{ 'Or' | transloco }}</p>
          <p class="content body">{{ 'Browse files' | transloco }}</p>
        </div>
      </div>
    </div>
    <ng-template #myItemTemplate let-fileItem="fileItem" let-uploadProgress="uploadProgress">
      <p class="subbody mb-0">File Size: {{ fileItem.file.size }}</p>
      <p class="subbody mb-0">File Name: {{ fileItem.fileName }}</p>
      <p class="subbody mb-0">Upload Progress: {{ uploadProgress }} %</p>
      <button (click)="uploader.removeFile(fileItem)">Remove</button>
    </ng-template>
  </dx-awesome-uploader>


</div>
