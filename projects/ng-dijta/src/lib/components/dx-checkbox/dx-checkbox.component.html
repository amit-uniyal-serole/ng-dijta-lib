<div class="ngdx-field-wrapper dx-checkbox-wrapper" [class.dx-disable]="disabled"
  [attr.data-label-position]="labelPosition">
  <mat-checkbox
    [tabIndex]="tabIndex"
    [id]="id"
    [checked]="value"
    [disabled]="disabled"
    [required]="required || ctrRequired"
    [labelPosition]="matLabelPosition"
    (change)="onInputChangeEvent($event)"
    (blur)="onTouched(); blur.emit($event)">

    <mat-label class="subbody">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
  </mat-checkbox>

  <div class="mat-mdc-form-field-subscript-wrapper">
    <mat-error *ngIf="control?.errors?.required && control?.touched" class="mx-2">
      <ng-content select="dx-error"></ng-content>
    </mat-error>
  </div>
</div>
