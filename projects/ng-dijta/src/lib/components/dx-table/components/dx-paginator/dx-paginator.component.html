<div class="dx-pagination" *ngIf="show">
  <div class="dx-pagination-card">
    
    <div class="pagination-tabs w-100" *ngIf="setting?.tabConfig">
      <div class="d-flex gap-2 w-100">
        <d-tabs class="w-100" [type]="setting?.tabConfig.type ?? 'tabs'" (activeTabChange)="activeTabChange.emit($event)"
          [activeTab]="setting?.tabConfig?.activeTab">
          <ng-container   *ngFor="let tab of tabsData;let i = index">
            <d-tab [id]="tab.event" [title]="tab?.tabName"></d-tab>
          </ng-container>
        </d-tabs>
        <button *ngIf="mobileDevice && setting?.tabConfig?.tabs?.length" matIconButton [matMenuTriggerFor]="menu"
          aria-label="Example icon-button with a menu">
          <mat-icon>more_horiz</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item *ngFor="let tab of menusData" (click)="onTabChange(tab?.event)">{{tab?.tabName}}</button>
        </mat-menu>
      </div>
    </div>
    <div class="d-flex align-items-center flex-xl-row flex-xxl-row flex-lg-row flex-sm-column justify-content-between w-100">
      <div class="pagination-div">  
        <div class="paginator-checkbox" *ngIf="setting?.paginatorMultiSelect">
          <mat-checkbox (change)="$event ? onMasterToggle() : null" [checked]="selection?.hasValue() && isAllSelected"
            [indeterminate]="selection?.hasValue() && !isAllSelected">
          </mat-checkbox>
        </div>
        <!-- change-view -->
        <dx-bulk-actions [bulkAction]="setting?.leftDropDown"
          (onBulkActionSubMenuClick)="onBulkActionSubMenuClick($event)" (onClickBulkMenuAction)="changeView($event)"
          (onClickMarkAsDefault)="onClickMarkAsDefault($event)" (onClickCreateCustomView)="clickCreateCustomView()"
          (onSearchBulkActionMenu)="leftDropDownSearch($event)">
        </dx-bulk-actions>
        <!--  -->
        <div class="d-flex align-items-center gap-1">
          <ng-container *ngFor="let action of setting?.leftActions">
            <ng-container *ngIf="
                action?.permission
                  ? (action?.permission?.permission
                    | ablePure : action?.permission?.apiName
                    | async)
                  : true
              ">
              <button mat-stroked-button class="bt-filter" [ngClass]="{
                  'flex-active-icon': action?.active,
                  'mat-flat-button': action?.viewType === 'button',
                  'mat-icon-button': action?.viewType === undefined,
                  'mat-button-disabled': action?.disable
                }" [disabled]="action?.disable" [matTooltip]="action?.label | transloco" matTooltipPosition="below"
                (click)="onEvent(action?.type)">
                <span class="d-flex justify-content-center align-items-center"
                  [ngClass]="{ filter: action?.viewType === 'button' }">
                  <p *ngIf="action?.viewType">{{ action?.label | transloco }}</p>
                  <mat-icon>{{ action?.icon }}</mat-icon>
                </span>
              </button>
            </ng-container>
          </ng-container>
        </div>
       
      </div>
      <div class="pagination-div">
        <div class="pagination-div-child">
          <!-- Page Size Selection -->
          <div>
            <!-- <span class="subbody">Items per page:</span>
            <dx-bulk-actions *ngIf="!setting?.isHidePageSizeSelection" [bulkAction]="pageSizeSelection"
              (onClickBulkMenuAction)="
            onSelectPageSize($event?.type)">
            </dx-bulk-actions> -->
          
          </div>
          <!--  -->
          <mat-paginator *ngIf="setting?.pagination" class="paragraph" [length]="setting?.totalItems"
            [pageSize]="setting?.pageSize" [showFirstLastButtons]="setting?.paginationFirstLastButtons" [pageSizeOptions]="
              setting?.isHidePageSizeSelection ? [] : pageSizeOptions
            " [hidePageSize]="setting?.isHidePageSizeSelection" (page)="onPaginate($event)"
            [pageIndex]="setting?.pageIndex" aria-label="Select page">
          </mat-paginator>
          <span class="separator" *ngIf="
              setting?.rightActions ||
              (setting?.bulkActions &&
                setting?.bulkActions &&
                setting?.bulkActions?.show) ||
              showSeparator ||
              multiViewTable?.isMultiViewToggle
            ">|</span>
          <ng-container *ngFor="let action of setting?.rightActions">
            <button mat-stroked-buttonclass="bt-filter" [ngClass]="{
                'flex-active-icon': action?.active,
                'mat-flat-button': action?.viewType === 'button',
                'mat-icon-button': action?.viewType === undefined,
                'mat-button-disabled': action?.disable
              }" [disabled]="action?.disable" [matTooltip]="action?.label | transloco" matTooltipPosition="below"
              (click)="onEvent(action?.type)">
              <span class="d-flex justify-content-center align-items-center"
                [ngClass]="{ filter: action?.viewType === 'button' }">
                <p *ngIf="action?.viewType">{{ action?.label | transloco }}</p>
                <mat-icon>{{ action?.icon }}</mat-icon>
              </span>
            </button>
          </ng-container>
          <ng-content></ng-content>
          <!-- bulk -->
          <dx-bulk-actions [bulkAction]="setting?.bulkActions" (onClickBulkMenuAction)="onEvent($event?.type)">
          </dx-bulk-actions>&nbsp;
          <!--  -->
          <div class="filter view-switcher" *ngIf="multiViewTable?.isMultiViewToggle">
            <span class="view-switcher-icons">
              <span class="material-icons" [matTooltip]="'Table View'" [ngClass]="{
                  active: 'dx-table' === multiViewTable?.selectedView
                }" (click)="onClickSelectView('dx-table')">
                table_chart
              </span>
              |
              <span class="material-icons" [matTooltip]="'Canvas View'" [ngClass]="{
                  active: 'dx-canvas' === multiViewTable?.selectedView
                }" (click)="onClickSelectView('dx-canvas')">
                table_rows
              </span>
            </span>
          </div>
        </div>
        <div class="tbl-multi-action">
          <dx-button *ngIf="setting?.multiActionButtonSettings?.show" [confirmationPopover]="
              setting?.multiActionButtonSettings?.confirmationPopover
            " [src]="setting?.multiActionButtonSettings?.src" [disabled]="setting?.multiActionButtonSettings?.disabled"
            [title]="setting?.multiActionButtonSettings?.title" [class]="setting?.multiActionButtonSettings?.class"
            [multiActionDropDown]="
              setting?.multiActionButtonSettings?.multiActionDropDown
            " (onActionSelect)="onEvent(setting?.multiActionButtonSettings?.type)"
            [permission]="setting?.multiActionButtonSettings?.permission" (onClickMenuAction)="onEvent($event)">
          </dx-button>
        </div>
      </div>
    </div>
  </div>
</div>
