<div class="custom-select">
  <select class="form-select" [value]="selectedValue" [required]="required" [class.required]="required" [disabled]="readonly" (change)="onSelectionChange($event.target.value)">
    <option *ngFor="let option of (options | async)" [value]="option?.keyTt">{{ option?.valueTt }}</option>
  </select>
</div>
