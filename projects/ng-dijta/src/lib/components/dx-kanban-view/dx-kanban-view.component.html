<div class="dx-kanban-view-wrapper" scrollHeight [heightReduce]="60" #kanbanView>
    <div cdkDropList class="dx-kanban-view-board" cdkDropListOrientation="horizontal">
        <ng-container *ngFor="let column of dataSource?.columns">
            <!-- Board Columns -->
            <dx-kanban-onscroll-render [column]="column" (onKanbanCardAction)="onClickAction($event)"
                [height]="(kanbanView.offsetHeight ?? 200) - 60"></dx-kanban-onscroll-render>
        </ng-container>

    </div>
</div>
