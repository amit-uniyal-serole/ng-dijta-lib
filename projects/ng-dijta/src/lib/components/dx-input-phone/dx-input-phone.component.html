<div class="dx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline" [class.display-view]="viewOnly"
  [class.dx-disable]="disabled" [class.left-align-label]="labelPosition === 'left'" floatLabel="never"
  [class.none-border]="noneBorder" [class.required]="required" [class]="outerLabelErrorType">
  <mat-label class="dx-outer-label-wrapper">
    <span class="dx-outer-label">
      <ng-content select="[dxLabel]"></ng-content>
      <span *ngIf="required" class="astrict">*</span>
    </span>
  </mat-label>
  <mat-form-field appearance="outline" floatLabel="never">
    <mat-label class="dx-input-label">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <dx-phone-contact [tabIndex]="tabIndex" [preferredCountries]="preferredCountries" [enablePlaceholder]="enablePlaceholder"
      [inputPlaceholder]="inputPlaceholder" [cssClass]="cssClass" [name]="name" [onlyCountries]="onlyCountries"
      [errorStateMatcher]="errorStateMatcher" [enableSearch]="enableSearch" [searchPlaceholder]="searchPlaceholder"
      [describedBy]="describedBy" [required]="required" [format]="format" [formControl]="control"
      (ngModelChange)="inputChange($event)" [(ngModel)]="value" [readonly]="readonly"
      (countryChanged)="onCountryChanged($event)" [id]="id">
    </dx-phone-contact>

    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-error>
      <span *ngIf="!errorMessage && control?.errors?.validatePhoneNumber">{{ invalidErrorMessage ? invalidErrorMessage
        :'Enter valid contact number'}}</span>
      <span
        *ngIf="!errorMessage && control?.errors?.numberNotAllowedError">{{control?.errors?.numberNotAllowedError}}</span>
      <span *ngIf="errorMessage && control?.errors?.validatePhoneNumber">{{errorMessage}}</span>
      <ng-content select="dx-error"></ng-content>
    </mat-error>
  </mat-form-field>

</div>
