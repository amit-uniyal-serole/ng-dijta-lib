<div class="dx-field-wrapper dx-field-textarea" [class.none-label]="noneLabel" [ngClass]="outline"
  [class.display-view]="viewOnly" [class.dx-disable]="disabled" [class.left-align-label]="labelPosition==='left'"
  [class.required]="required || ctrRequired" [class]="outerLabelErrorType" [class.none-border]="noneBorder">
  <mat-label class="dx-outer-label-wrapper">
    <span class="dx-outer-label">
      <ng-content select="[dxLabel]"></ng-content>
      <span *ngIf="required || ctrRequired" class="astrict">*</span>
    </span>
  </mat-label>
  <mat-form-field appearance="outline">
    <mat-label class="dx-input-label">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <span matPrefix>
      <div>
        <ng-content select="dx-prefix"></ng-content>
      </div>
    </span>
    <textarea [tabIndex]="tabIndex" [id]="id" [mentionConfig]="mentionConfigDetails ?? {}" matInput [maxlength]="maxLength" [rows]="row ?? 2"
      [minlength]="minLength" [formControl]="control" (ngModelChange)="inputChange($event)" (blur)="onBlur($event)"
      [required]="required || ctrRequired" [readonly]="readonly || viewOnly || disabled"
      [placeholder]="tooltip"></textarea>
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-hint align="end" *ngIf="maxLength">{{value?.length}} / {{maxLength}}</mat-hint>
    <mat-error>
      <ng-content select="dx-error"></ng-content>
    </mat-error>
  </mat-form-field>

</div>
