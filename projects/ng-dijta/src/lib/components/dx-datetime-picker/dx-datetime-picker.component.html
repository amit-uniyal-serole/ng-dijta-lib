<div class="ngdx-field-wrapper dx-datetime-picker" [class.none-label]="noneLabel" [ngClass]="outline"
  [class.display-view]="viewOnly" [class.dx-disable]="disabled" [class.left-align-label]="labelPosition === 'left'"
  floatLabel="never" [class.required]="required || ctrRequired" [class]="outerLabelErrorType"
  [class.readonly]="readonly">

  <mat-label class="dx-outer-label" *ngIf="outline === 'outer-label'">
    <span class="dx-outer-label d-flex align-items-center">
      <ng-content select="[dxLabel]"></ng-content>
      <span *ngIf="required || ctrRequired" class="astrict">*</span>
    </span>
  </mat-label>


  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label *ngIf="outline !== 'outer-label'">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <span matPrefix>
      <ng-content select="dx-prefix"></ng-content>
    </span>
    <input [tabIndex]="tabIndex" [id]="id" [ngModel]="value" (ngModelChange)="inputChange($event)" matInput
      [max]="maxDate" [datetimePickerFormat]="format" [min]="minDate" [ngxMatDatetimePicker]="picker"
      placeholder="{{readonly? '' : ''}}" (dateInput)="dateChange('input', $event)"
      (dateChange)="dateChange('change', $event)" [disabled]="disabled" ngDefaultControl
      [readonly]="readonly || viewOnly || disabled" [required]="required || ctrRequired">
    <mat-datepicker-toggle [tabIndex]="tabIndex" matSuffix [for]="$any(picker)" [disabled]="disabled || readonly">
      <span class="material-icons" matDatepickerToggleIcon>
        event
      </span>
    </mat-datepicker-toggle>
    <ngx-mat-datetime-picker #picker [showSpinners]="showSpinners" [showSeconds]="showSeconds" [stepHour]="stepHour"
      [stepMinute]="stepMinute" [stepSecond]="stepSecond" [touchUi]="touchUi" [color]="color"
      [enableMeridian]="enableMeridian" [defaultTime]="defaultTime">
    </ngx-mat-datetime-picker>
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-error>
      <ng-content select="dx-error"> </ng-content>
    </mat-error>
  </mat-form-field>
</div>
