<div class="ngdx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline" [class.display-view]="viewOnly"
  [class.dx-disable]="disabled" [class.left-align-label]="labelPosition==='left'"
  [class.required]="required || ctrRequired">
  <mat-label class="dx-outer-label" *ngIf="outline === 'outer-label'">
    <span class="dx-outer-label d-flex align-items-center">
      <ng-content select="[dxLabel]"></ng-content>
      <span *ngIf="required || ctrRequired" class="astrict">*</span>
    </span>
  </mat-label>
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label *ngIf="outline !== 'outer-label'" >
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <span matPrefix>
      <span class="material-icons dx-input-icon">
        email
      </span>
    </span>
    <input dxNoLeadingTrailingSpaces [tabIndex]="tabIndex" [id]="id" matInput [formControl]="control" (ngModelChange)="inputChange($event)"
      (blur)="onBlur($event)" [readonly]="readonly || viewOnly || disabled" [minlength]="minLength"
      [maxlength]="maxLength" [required]="required || ctrRequired" [placeholder]="tooltip" [mask]="mask"
      [patterns]="maskingPatterns" [dropSpecialCharacters]="false" />
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-error>      
      <span *ngIf="control?.errors?.['NoleadingTrailingSpaces'];else inValidEmailRef" class="space-error">{{ 'Please remove any extra spaces from the start or end of your email.'  }}</span>
      <ng-template #inValidEmailRef>
        <span *ngIf="control.errors?.pattern">{{control.errors?.pattern?.actualValue}} not valid email</span>
      </ng-template>
      <ng-content select="dx-error"></ng-content>
    </mat-error>
  </mat-form-field>

</div>
