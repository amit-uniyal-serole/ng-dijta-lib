<div class="dx-header header-shadow px-3 color-inherit d-flex align-items-center position-relative ">
  <div class="dx-header__logo color-inherit d-flex align-items-center w-auto visible gap-1">
    @if(selectedCompany?.logo) {
    <img [src]="selectedCompany?.logo" alt="Logo" width="100px" class="img-fluid h-100 py-1 rounded mx-auto d-block">
    }
    <div class="ms-auto surface_on_base ">
      @if(!selectedCompany?.hideName) {
      <p class="heading-6 fw-normal m-0">{{ selectedCompany?.name | transloco }}</p>
      }
    </div>
  </div>
  <div class="dx-header__content color-inherit flex-fill gap-2 d-flex align-items-center">
    <div class="dx-header-left color-inherit d-flex align-items-center">
      <!--  Beside Company Logo/Name -->
    </div>
    <div class="dx-header-right color-inherit gap-4 d-flex align-items-center ms-auto">
      @if((isSmall$ | async)) {
      <div class="header-dots color-inherit d-flex ms-auto gap-2">
        @for(item of headerIcons; track item) {
        <button id="menuItem" aria-label="Icon"
          class="bg-transparent color-inherit d-flex p-0 align-items-center border-0 icon-wrapper-alt m-0 overflow-visible position-relative text-center rounded-circle cursor-pointer"
          (click)="onClickIcon(item?.event)">
          <mat-icon class="d-flex align-items-center justify-content-center icon-color" aria-hidden="false"
            aria-label="{{item?.label | transloco}}" [fontIcon]="item?.icon"></mat-icon>
        </button>
        }
        <ng-content select="dx-header-action"></ng-content>
        @if(notification) {
        <button
          class="bg-transparent color-inherit border-0 p-0 d-flex align-items-center icon-wrapper-alt m-0 overflow-visible position-relative rounded-circle notifications cursor-pointer"
          [matMenuTriggerFor]="notificationMenu" #t="matMenuTrigger" (click)="matMenuTrigger(t?.menuOpen)"
          (menuClosed)="isClosed()">
          <mat-icon class="d-flex align-items-center justify-content-center icon-color" aria-hidden="false"
            aria-label="Notifications" fontIcon="notifications_none"></mat-icon>
          @if(latestNotificationCount){
          <span
            class="position-absolute top-0 start-100 translate-notification-badge border border-light rounded-circle bg-danger p-1">
            <span class="visually-hidden">unread messages</span>
          </span>
          }
        </button>
        <mat-menu id="notificationMenu" class="notification-menu color-inherit" #notificationMenu="matMenu">
          <button (click)="$event.stopPropagation()" class="bg-transparent color-inherit notification-main-wrapper border-0 p-0">
            @if(!isNewNotification) {
            <dx-notification [unReadNotificationCount]="unReadNotificationCount"
              [topBarNotificationData]="topBarNotificationData" (onReadNotification)="readNotification($event)"
              (onClickLoadMore)="loadMore($event)" (onClickMarkAllasRead)="markAllAsRead($event)"></dx-notification>
            } @else if(isNewNotification){
            <ng-content class="notification"></ng-content>
            }
          </button>
        </mat-menu>
        }
      </div>
      }
      <div class="header-btn-lg color-inherit pr-0 d-flex align-items-center position-relative">
        <div class="widget-content color-inherit pe-2">
          <div class="widget-content-wrapper color-inherit flex-fill cursor-pointer d-flex align-items-center position-relative">
            <button class="widget-content-left color-inherit bg-transparent border-0 p-0 " (click)="showProfile()">
              <div class="align-middle color-inherit position-relative d-inline-flex">
                <a class="p-0 btn">
                  @if(currentUser?.profileBasic?.imgSrc){
                  <img width="42" class="rounded-circle" [src]="currentUser?.profileBasic?.imgSrc" alt="Profile">
                  } @else {
                  <ndx-avatar [avatarSettings]="avatarSettings" [src]="currentUser?.profileBasic?.imgSrc"
                    [name]="currentUser?.profileBasic?.name ?? ''"></ndx-avatar>
                  }
                </a>
              </div>
            </button>
            <button class="widget-content-left color-inherit bg-transparent border-0 p-0 ms-1 header-user-info d-flex flex-column"
              (click)="showProfile()">
              <div class="text-nowrap color-inherit text-start">
                <p class="subbody mb-0 "> {{ currentUser?.profileBasic?.name ?? '' |
                  transloco }}</p>
              </div>
              <div class="text-nowrap color-inherit text-start">
                <p class="paragraph mb-0">{{ currentUser?.profileBasic?.email }}</p>
              </div>
            </button>
          </div>

        </div>
        <div class="nav-item dropdown color-inherit header-nav-profile border-start px-2"
          *ngIf="(app$ | async) && (app$ | async)?.position === 'default'" id="app-name">
          <div *ngIf="(app$ | async)?.svg;else default_app_icon" class="svg" dx-tooltip
            [dxTooltipTitle]="(app$ | async)?.fullName | transloco" [innerHTML]="(app$ | async)?.svg | dxsafe: 'html'">
          </div>
          <ng-template #default_app_icon>
            <ndx-avatar [avatarSettings]="appSettings" [name]="(app$ | async)?.fullName"> </ndx-avatar>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
