<div class="flex-menu-sidebar-section">
  <div id="flex-menu-wrapper" class="global-navigation">
    <div class="menu">
      <ul id="dx-flex-menu-items" class="top-menu">
        <ng-container *ngIf="!isMenusLoading;else menuSkeletonLoader">

          <ng-container *ngFor="let menu of sortedMenu(flexMenuList)">

            <ng-container *ngIf="menu.isDisplay || disableDispalyConditions">
              <a [@menuItems]="menuItemsListToogle" class="link" [class.show-flex-menus]="breakHeight?.length>2"
                [routerLink]='menu?.route?.path' (mouseover)="onMouseOver(activeMenu===menu?.code)"
                (click)="onMenu(menu)" routerLinkActive='active' [ngClass]="{ active: activeMenu === menu?.code }"
                dx-tooltip dxTooltipTitle="{{ menu?.label | transloco }}" dxTooltipPlacement="right"
                matTooltipClass="tooltip-color"
                *ngIf="menu?.permission ? (menu.permission?.permission | ablePure: menu.permission?.apiName | async) : true">
                <div class="wrapper-menu">
                  <span class="material-icons-outlined">
                    {{ menu?.icon }}
                  </span>
                  <p class="m-0 input"> {{menu?.label | transloco}}
                  </p>
                </div>
              </a>
            </ng-container>
          </ng-container>


          <!-- last active item -->
          <a *ngIf="activeItem && activeItem.position !== 'bottom'" class="link"
            [class.show-flex-menus]="breakHeight?.length>2" [routerLink]='activeItem?.route?.path'
            (mouseover)="onMouseOver(activeMenu===activeItem?.code)" (click)="onMenu(activeItem)"
            routerLinkActive='active' [ngClass]="{ active: activeMenu === activeItem?.code }" dx-tooltip
            dxTooltipTitle="{{ activeItem?.label | transloco }}" dxTooltipPlacement="right">
            <div class="wrapper-menu">
              <span class="material-icons-outlined">
                {{ activeItem?.icon }}
              </span>
              <p class="m-0 input">{{activeItem?.label | transloco}}
              </p>
            </div>
          </a>
          <!--  -->
          <!-- More -->
          <li [@menuItems]="menuItemsListToogle" *ngIf="(flexMenuService?.filteredMenus|async)?.length">
            <button class="link flex-more-menu" mat-button (click)="menuTrigger.openMenu()"
              [class.show-flex-menus]="breakHeight?.length>2" [class.flex-more-panel]="menuTrigger?.menuOpen">
              <div #menuTrigger="matMenuTrigger" [matMenuTriggerFor]="menu"></div>
              <div class="wrapper-menu">
                <span class="material-icons-outlined">
                  more_horiz
                </span>
                <p class="m-0 input"> {{'More' | transloco}}
                </p>
              </div>
            </button>
          </li>

          <mat-menu #menu="matMenu" class="flex-menu-more-panel">
            <ng-container *ngFor="let menu of (flexMenuService?.filteredMenus|async)">
              <div matMenuContent
                *ngIf="menu?.permission ? (menu.permission?.permission | ablePure: menu.permission?.apiName | async) : true">
                <button type="button" class="flex-menu-button" [routerLink]='menu?.route?.path' (click)="onMenu(menu)"
                  routerLinkActive='active' [ngClass]="{ active: activeMenu === menu?.code }" dx-tooltip
                  dxTooltipTitle="{{ menu?.label | transloco }}" dxTooltipPlacement="right">
                  <span class="material-icons-outlined">
                    {{ menu?.icon }}
                  </span>
                  <span class="input mx-2 flex-btn-label ellipsis">{{ menu.label | transloco }}</span>
                </button>
              </div>
            </ng-container>


          </mat-menu>
          <!--  -->
          <div (mouseleave)="onMouseOver(false)" class="close-panel-palceholder"></div>
          <!-- Min & Max -->
          <div class="min-max-icon">
            <ng-container *ngFor="let menu of getBottomPosition()">
              <a [@menuItems]="menuItemsListToogle" [routerLink]='menu?.route?.path' class="link"
                *ngIf="menu?.permission ? (menu.permission?.permission | ablePure: menu.permission?.apiName | async) : true"
                (click)="onMenu(menu)">
                <div class="wrapper-menu">
                  <div class="wrapper-menu">
                    <span class="material-icons-outlined">
                      {{ menu?.icon }}
                    </span>
                    <p class="m-0 input"> {{menu?.label | transloco}}
                    </p>
                  </div>
                </div>
              </a>
            </ng-container>

            <li *ngIf="subMenuList?.length > 0" class="link" (click)="toggle(maximize=!maximize)" dx-tooltip
              dxTooltipTitle="{{subMenu==='in'?'Minimize':'Maximize' }}" dxTooltipPlacement="right"
              [class.show-flex-menus]="breakHeight?.length>2">
              <div class="wrapper-menu">
                <span class="material-icons-outlined">
                  {{ subMenu==='in' && maximize? 'menu_open' : 'clear_all'}}
                </span>
              </div>
            </li>
          </div>

          <!--  -->
        </ng-container>
      </ul>
    </div>
  </div>
  <div class="contextual-navigation" scrollHeight *ngIf="subMenuList?.length > 0" [@slideInOut]="subMenu"
    (mouseover)="onMouseOver(true)" (mouseleave)="onMouseOver(false)">
    <div class="sub-menu">
      <ul class="links" [@slideInOutTwo]="subMenu">
        <li *ngIf="subMenuList?.length > 0">
          <h3 class="subbody fw-semibold m-2">{{subMenuList[0]?.parentName | transloco}}</h3>
        </li>
        <ng-container *ngFor="let item of subMenuList;let i=index">
          <ng-container *ngIf="item.isDisplay || disableDispalyConditions">
            <li
              *ngIf="item?.permission ? (item.permission?.permission | ablePure: item.permission?.apiName | async) : true">
              <dx-menu-list-item [disableDispalyConditions]="disableDispalyConditions" [item]="item" [index]="i"
                [list]="subMenuList"></dx-menu-list-item>
            </li>
          </ng-container>
        </ng-container>
      </ul>
    </div>
  </div>
</div>


<ng-template #menuSkeletonLoader>
  <div *ngFor="let item of [1,2,3,4,5,6,7]">
    <div class="flex-menu-item-loader  menu-icon-loader "></div>
    <div class="flex-menu-item-loader menu-label-loader "></div>
    <div class="mb-3"></div>
  </div>
</ng-template>
