<div class="sidebar-section">
  <div class="global-navigation" id="main-sidebar">
    <div class="menu">
      <ul class="top-menu">
        <ng-container *ngFor="let menu of menu">
          <li class="link"
            *ngIf="menu?.permission ? (menu.permission?.permission | ablePure: menu.permission?.apiName | async) : true"
            [routerLink]='menu?.route?.path' (click)="onMenu(menu)" routerLinkActive='active'
            [ngClass]="{ active: activeMenu === menu?.code }" matTooltip="{{ menu?.label | transloco }}"
            [matTooltipPosition]="'right'" matTooltipClass="tooltip-color">
            <div class="wrapper-menu">
              <span class="material-icons-outlined">
                {{ menu?.icon }}
              </span>
              <p class="m-0 title">
                <span translate> {{menu?.label | transloco}}</span>
              </p>
            </div>
          </li>
        </ng-container>

      </ul>
    </div>
  </div>
  <div class="contextual-navigation" *ngIf="subMenuList?.length > 0" [@slideInOut]="subMenu">
    <div class="sub-menu">
      <div class="collapse-icon">
        <span class="material-icons-outlined" [@rotatedState]="subMenu" (click)="toggle()">
          chevron_left
        </span>
      </div>
      <ul class="links" [@slideInOutTwo]="subMenu">
        <li *ngIf="subMenuList?.length > 0">
          <h3 class="submenu-title">{{subMenuList[0]?.parentName | transloco}}</h3>
        </li>
        <ng-container *ngFor="let subMenu of subMenuList">
          <li
            *ngIf="subMenu?.permission ? (subMenu.permission?.permission | ablePure: subMenu.permission?.apiName | async) : true"
            routerLink='/{{subMenu?.route?.path}}' (click)="onSubMenu(subMenu)"
            [routerLinkActiveOptions]="{exact: true}" routerLinkActive='active' matTooltip="{{ subMenu?.label }}"
            [matTooltipPosition]="'below'" [ngClass]="{ active: submenuMenu === subMenu?.code }"
            matTooltipClass="tooltip-color">
            <div class="link" [ngClass]="{ active: submenuMenu === subMenu?.code }">
              <span class="material-icons-outlined">
                {{ subMenu?.icon }}
              </span>
              <p class="m-0 body ellipsis">{{ subMenu?.label | transloco }}</p>
            </div>

          </li>
        </ng-container>

      </ul>
    </div>
  </div>
</div>
