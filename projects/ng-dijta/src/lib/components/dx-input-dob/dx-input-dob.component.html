<div class="dx-field-wrapper input-variant-layout dx-datepicker-aligment" [class.none-label]="noneLabel"
  [ngClass]="outline" [class.display-view]="viewOnly" [class.dx-disable]="disabled" [class.required]="required"
  [class.left-align-label]="labelPosition === 'left'" [class]="outerLabelErrorType">
  <mat-label class="dx-outer-label-wrapper">
    <span class="dx-outer-label">
      <ng-content select="[dxLabel]"></ng-content>
      <span *ngIf="required" class="astrict">*</span>
    </span>
  </mat-label>
  <mat-form-field appearance="outline" floatLabel="never">
    <span matPrefix class="material-icons-outlined cursor-pointer">{{icon}}</span>
    <mat-label class="dx-input-label">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <input [formControl]="control" (ngModelChange)="inputChange($event)" matInput [max]="maxDate" [min]="minDate"
      [matDatepicker]="picker" [placeholder]="placeholder" (dateInput)="dateChange('input', $event)"
      (dateChange)="dateChange('change', $event)" ngDefaultControl [readonly]="readonly || viewOnly || disabled" />
    <mat-datepicker-toggle matSuffix [for]="picker" [disabled]="disabled">
      <span class="material-icons" matDatepickerToggleIcon>
        event
      </span>
    </mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-error>
      <ng-content select="dx-error"> </ng-content>
    </mat-error>
  </mat-form-field>

</div>
