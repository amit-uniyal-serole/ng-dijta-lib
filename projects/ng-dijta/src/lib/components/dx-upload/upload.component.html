<ng-template #list>
  <dx-upload-list *ngIf="!dxFileListRender" #listComp [style.display]="dxShowUploadList ? '' : 'none'"
    [listType]="dxListType" [items]="dxFileList || []" [icons]="$any(dxShowUploadList)" [iconRender]="dxIconRender"
    [previewFile]="dxPreviewFile" [previewIsImage]="dxPreviewIsImage" [onPreview]="dxPreview" [onRemove]="onRemove"
    [onDownload]="dxDownload" [dir]="dir"></dx-upload-list>
  <ng-container *ngIf="dxFileListRender">
    <ng-container *ngTemplateOutlet="dxFileListRender; context: { $implicit: dxFileList }"></ng-container>
  </ng-container>
</ng-template>

<ng-template #con>
  <ng-content></ng-content>
</ng-template>

<ng-template #btn>
  <div [ngClass]="classList" [style.display]="dxShowButton ? '' : 'none'">
    <div dx-upload-btn #uploadComp [options]="_btnOptions!" [dxFileList]="dxFileList">
      <ng-template [ngTemplateOutlet]="con"></ng-template>
    </div>
  </div>
</ng-template>

<ng-template #multioption>
  <div [ngClass]="classList" [style.display]="dxShowButton ? '' : 'none'">
    <div dx-upload-btn #uploadComp [options]="_btnOptions!" [dxFileList]="dxFileList">
      <ng-template [ngTemplateOutlet]="con"></ng-template>
    </div>
  </div>
</ng-template>

<ng-container *ngIf="dxType === 'drag'; else select">
  <div [tabIndex]="tabIndex" [ngClass]="classList" (drop)="fileDrop($event)" (dragover)="fileDrop($event)" (dragleave)="fileDrop($event)">
    <div dx-upload-btn #uploadComp [options]="_btnOptions!" class="dx-upload-btn" [dxFileList]="dxFileList">
      <div class="dx-upload-drag-container">
        <ng-template [ngTemplateOutlet]="con"></ng-template>
      </div>
    </div>
  </div>
  <ng-template [ngTemplateOutlet]="list"></ng-template>
</ng-container>
<ng-template #select>
  <ng-container [ngSwitch]="dxListType">
    <ng-container *ngSwitchCase="'picture-card'">
      <ng-template [ngTemplateOutlet]="list"></ng-template>
      <ng-template [ngTemplateOutlet]="btn"></ng-template>
    </ng-container>
    <ng-container *ngSwitchCase="'multioption'">
      <button #uploadBtn class="upload-button" [matMenuTriggerFor]="menu" *ngIf="dxShowButton">
        <span class="material-icons-outlined">
          file_upload
        </span>
        <ng-content select="[dxLabel]"></ng-content>
      </button>
      <mat-menu class="upload-mat-menu" #menu="matMenu">
        <button mat-menu-item>
          <ng-template [ngTemplateOutlet]="btn"></ng-template>
        </button>
        <ng-container *ngFor="let action of dxUploadAction">
          <button mat-menu-item>
            <a (click)="ofterAction(action)">
              {{action.label}}
            </a>
          </button>
        </ng-container>
      </mat-menu>
      <ng-template [ngTemplateOutlet]="list"></ng-template>
    </ng-container>
    <ng-container *ngSwitchDefault>
      <ng-template [ngTemplateOutlet]="btn"></ng-template>
      <ng-template [ngTemplateOutlet]="list"></ng-template>
    </ng-container>
  </ng-container>
</ng-template>
