<div *ngFor="let file of list" class="dx-upload-list-{{ listType }}-container">
  <div class="dx-upload-list-item dx-upload-list-item-{{ file.status }} dx-upload-list-item-list-type-{{ listType }}"
    [attr.data-key]="file.key" @itemState dx-tooltip [dxTooltipTitle]="file.status === 'error' ? file.message : null">
    <ng-template #icon>
      <ng-container [ngSwitch]="file.iconType">
        <div *ngSwitchCase="'uploading'" class="dx-upload-list-item-thumbnail"
          [class.dx-upload-list-item-file]="!file.isUploading">
          <ng-template [ngTemplateOutlet]="iconNode" [ngTemplateOutletContext]="{ $implicit: file }"></ng-template>
        </div>
        <a *ngSwitchCase="'thumbnail'" class="dx-upload-list-item-thumbnail"
          [class.dx-upload-list-item-file]="!file.isImageUrl" target="_blank" rel="noopener noreferrer"
          [href]="file.url || file.thumbUrl" (click)="handlePreview(file, $event)">
          <img *ngIf="file.isImageUrl; else noImageThumbTpl" class="dx-upload-list-item-image"
            [src]="file.thumbUrl || file.url" [attr.alt]="file.name  | transloco" />
        </a>
        <div *ngSwitchDefault class="dx-upload-text-icon">
          <ng-template [ngTemplateOutlet]="iconNode" [ngTemplateOutletContext]="{ $implicit: file }"></ng-template>
        </div>
      </ng-container>
      <ng-template #noImageThumbTpl>
        <ng-template [ngTemplateOutlet]="iconNode" [ngTemplateOutletContext]="{ $implicit: file }"></ng-template>
      </ng-template>
    </ng-template>
    <ng-template #iconNode let-file>
      <ng-container *ngIf="!iconRender; else customIconRender">
        <ng-container [ngSwitch]="listType">
          <ng-container *ngSwitchCase="'picture'">
            <ng-container *ngIf="file.isUploading; else iconNodeFileIcon">
              <span class="material-icons-outlined">cached</span>
            </ng-container>
          </ng-container>
          <ng-container *ngSwitchCase="'picture-card'">
            <ng-container *ngIf="file.isUploading; else iconNodeFileIcon">
              {{ locale.uploading }}
            </ng-container>
          </ng-container>
          <span *ngSwitchDefault class="material-icons-outlined">{{file.isUploading ? 'loading' : 'attach_file'}}</span>
        </ng-container>
      </ng-container>
      <ng-template #customIconRender [ngTemplateOutlet]="iconRender"
        [ngTemplateOutletContext]="{ $implicit: file }"></ng-template>
      <ng-template #iconNodeFileIcon>
        <span class="material-icons-outlined">{{file.isImageUrl ? 'image' : 'attach_file'}}</span>
      </ng-template>
    </ng-template>
    <ng-template #removeIcon>
      <button *ngIf="icons.showRemoveIcon" type="button" nzType="text" nzSize="small"
        (click)="handleRemove(file, $event)" [attr.title]="locale.removeFile"
        class="dx-upload-list-item-card-actions-btn btn-transparent">
        <span class="material-icons-outlined">delete</span>
      </button>
    </ng-template>
    <ng-template #downloadIcon>
      <button *ngIf="file.showDownload" type="button" nzType="text" nzSize="small" (click)="handleDownload(file)"
        [attr.title]="locale.downloadFile" class="dx-upload-list-item-card-actions-btn btn-transparent">
        <span class="material-icons-outlined">download</span>
      </button>
    </ng-template>
    <ng-template #downloadOrDelete>
      <span *ngIf="listType !== 'picture-card'"
        class="dx-upload-list-item-card-actions {{ listType === 'picture' ? 'picture' : '' }}">
        <ng-template [ngTemplateOutlet]="downloadIcon"></ng-template>
        <ng-template [ngTemplateOutlet]="removeIcon"></ng-template>
      </span>
    </ng-template>
    <ng-template #preview>
      <a *ngIf="file.url" target="_blank" rel="noopener noreferrer" class="dx-upload-list-item-name"
        [attr.title]="file.name" [href]="file.url" [attr.download]="file.linkProps && file.linkProps.download"
        (click)="handlePreview(file, $event)">
        {{ file.name }}
        <span>({{calculateSize(file?.size)}})</span>
      </a>
      <span *ngIf="!file.url" class="dx-upload-list-item-name" [attr.title]="file.name"
        (click)="handlePreview(file, $event)">
        {{ file.name }}
        <span> ({{calculateSize(file?.size)}})</span>
      </span>
      <ng-template [ngTemplateOutlet]="downloadOrDelete"></ng-template>
    </ng-template>
    <div class="dx-upload-list-item-info">
      <span class="dx-upload-span">
        <ng-template [ngTemplateOutlet]="icon"></ng-template>
        <ng-template [ngTemplateOutlet]="preview"></ng-template>
      </span>
    </div>
    <span *ngIf="listType === 'picture-card' && !file.isUploading" class="dx-upload-list-item-actions">
      <a *ngIf="icons.showPreviewIcon" [href]="file.url || file.thumbUrl" target="_blank" rel="noopener noreferrer"
        [attr.title]="locale.previewFile"
        [ngStyle]="!(file.url || file.thumbUrl) ? { opacity: 0.5, 'pointer-events': 'none' } : null"
        (click)="handlePreview(file, $event)">
        <span class="material-icons-outlined">visibility</span>
      </a>
      <ng-container *ngIf="file.status === 'done'">
        <ng-template [ngTemplateOutlet]="downloadIcon"></ng-template>
      </ng-container>
      <ng-template [ngTemplateOutlet]="removeIcon"></ng-template>
    </span>
    <div *ngIf="file.isUploading" class="dx-upload-list-item-progress">

      <mat-progress-bar mode="determinate" [value]="file.percent"></mat-progress-bar>
    </div>
  </div>
</div>
