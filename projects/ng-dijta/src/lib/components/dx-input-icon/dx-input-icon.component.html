<div class="ngdx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline" [class.display-view]="viewOnly"
  [class.dx-disable]="disabled" [class.left-align-label]="labelPosition === 'left'" floatLabel="never"
  [class.required]="required || ctrRequired" [class]="outerLabelErrorType" [class.readonly]="readonly">
  <mat-label class="dx-outer-label">
    <span class="dx-outer-label d-flex align-items-center">
      <ng-content select="[dxLabel]"></ng-content>
      <span *ngIf="required || ctrRequired" class="astrict">*</span>
    </span>
  </mat-label>
  <mat-form-field appearance="outline" floatLabel="always">
    <span matPrefix *ngIf="value" class="material-icons-outlined ">
      <span class="dx-input-icon override-color selected-input-Icon material-icons">
        {{value}}
      </span>
    </span>
    <span matSuffix class="material-icons cursor-pointer" type="button" (click)="openIcon()" *ngIf="!disabled">
      {{icon}}
    </span>
    <mat-label *ngIf="outline !== 'outer-label'">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <input type="text" matInput readonly [mask]="mask" [(ngModel)]="value" [placeholder]="placeholder" [readonly]="true"
      (ngModelChange)="inputChange($event)" (blur)="onBlur($event)" />
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-error>
      <div class="dx-error">
        <ng-content select="dx-error"> </ng-content>
      </div>
    </mat-error>
  </mat-form-field>
  <mat-error>
    <div class="dx-error">
      <ng-content select="dx-error"> </ng-content>
    </div>
  </mat-error>
</div>
