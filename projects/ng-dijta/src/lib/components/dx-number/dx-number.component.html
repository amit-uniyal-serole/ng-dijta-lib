<div class="dx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline"
  [class.error]="control?.invalid && (control.touched || control.dirty)" [class.display-view]="viewOnly" [class.dx-disable]="disabled"
  [class.left-align-label]="labelPosition==='left'" [class.required]="required" [class]="outerLabelErrorType"
  [class.none-border]="noneBorder">
  <mat-label class="dx-outer-label-wrapper">
    <span class="dx-outer-label">
      <ng-content select="[dxLabel]"></ng-content>
      <span *ngIf="required" class="astrict">*</span>
    </span>
  </mat-label>
  <mat-form-field appearance="outline">
    <mat-label class="dx-input-label">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <input [tabIndex]="tabIndex" [id]="id" type="number" matInput [formControl]="control" appNumberInput [seprater]="seprater"
      [maxDigits]="precision" [placeholder]="tooltip" (ngModelChange)="inputChange($event)" [disabled]="disabled"
      (blur)="onBlur($event)" [readonly]="readonly || viewOnly" [maxNumberlength]="maxLength" [minLength]="minLength"
      [value]="control.value" ngDefaultControl />
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-error>
      <ng-content select="dx-error"></ng-content>
    </mat-error>
  </mat-form-field>
</div>
