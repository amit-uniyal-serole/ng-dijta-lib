<div class="dx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline" [class.display-view]="viewOnly"
    [class.dx-disable]="disabled" [class.left-align-label]="labelPosition === 'left'" floatLabel="never"
    [class.required]="required || ctrRequired" [class]="outerLabelErrorType">
    <mat-label class="dx-outer-label-wrapper">
        <span class="dx-outer-label">
            <ng-content select="[dxLabel]"></ng-content>
            <span *ngIf="required || ctrRequired" class="astrict">*</span>
        </span>
    </mat-label>
    <mat-form-field appearance="outline" floatLabel='never'>
        <mat-label class="dx-input-label">
            <ng-content select="dx-label"></ng-content>
        </mat-label>

        <span matPrefix>
            <ng-content select="dx-prefix"></ng-content>
        </span>
        <div [formGroup]="lookupFg">
            <input [tabIndex]="tabIndex" matInput formControlName="name" [id]="id+'-'+'val'" (blur)="onBlur($event)" [readonly]="true"
                [required]="required || ctrRequired" ngDefaultControl [placeholder]="tooltip"
                class="multi-lookup-overflow-text" />
        </div>
        <span matSuffix>
            <button [tabIndex]="tabIndex" [id]="id+'-'+'click'"
                *ngIf="!readonly && lookupModalConfig?.lookupApiConfig && lookupModalConfig?.tableSettings"
                class="material-icons-outlined lookup-opener-btn cursor-pointer" (click)="openLookup()">
                manage_search
            </button>
            <ng-content select="dx-suffix"></ng-content>
        </span>
        <mat-hint>
            <ng-content select="dx-hint"> </ng-content>
        </mat-hint>
        <mat-error>
            <ng-content select="dx-error"></ng-content>
        </mat-error>
    </mat-form-field>
</div>
