<div class="dx-chip-autocomplete dx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline"
  [class.error]="control?.invalid && (control.touched || control.dirty)">
  <mat-form-field appearance="outline">
    <mat-label class="dx-input-label">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <mat-select #multiSelect [id]="id" [(ngModel)]="value" [compareWith]="comparer"
      (ngModelChange)="inputChange($event) " [required]="required" multiple
      (selectionChange)="onDropDownChange($event.value)" [disabled]="disabled">
      <mat-select-trigger>
        <mat-chip-list>
          <span *ngFor="let data of value">
            <mat-chip *ngIf="data" [removable]="true" (removed)="onRemoveChip(data)">
              {{ data?.valueTt | transloco }}
              <mat-icon matChipRemove class="material-icons-outlined">close</mat-icon>
            </mat-chip>
          </span>
        </mat-chip-list>
      </mat-select-trigger>
      <mat-option>
        <ngx-mat-select-search #selectSearch [formControl]="searchCtrl" placeholderLabel="Search"
          noEntriesFoundLabel="no match found"></ngx-mat-select-search>
      </mat-option>
      <div>
        <!-- groups -->
        <ng-container *ngIf="groups && groups?.length>0">
          <mat-optgroup *ngFor="let group of filteredGroups | async" [label]="group?.label">
            <mat-option *ngFor="let option of group?.options" [value]="option">
              <div class="item">
                <span>
                  {{option?.valueTt | transloco}}
                </span>
              </div>
            </mat-option>
          </mat-optgroup>
        </ng-container>
        <!--  -->
        <!-- options -->
        <ng-container *ngIf="options && options?.length>0">
          <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
            <div class="item">
              <span>
                {{option?.valueTt | transloco}}
              </span>
            </div>
          </mat-option>
        </ng-container>
        <!--  -->
        <div class="mat-option create-option-wrapper" *ngIf="createOption?.isShow"
          (click)="onClickCreateCustomOption()">
          <div class="item">
            <span class="align-material-icon-text">
              <span class="material-icons">add</span><span class="create-option-label">{{createOption?.label |
                transloco}}</span>
            </span>
          </div>
        </div>
      </div>
    </mat-select>
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
  </mat-form-field>
  <mat-error>
    <div class="dx-error">
      <ng-content select="dx-error"></ng-content>
    </div>
  </mat-error>
</div>
