<div class="dx-chip-autocomplete ngdx-field-wrapper" [class.none-label]="noneLabel" [ngClass]="outline"
  [class.display-view]="viewOnly" [class.dx-disable]="disabled" [class.left-align-label]="labelPosition === 'left'"
  floatLabel="never" [class.required]="required || ctrRequired" [class]="outerLabelErrorType"
  [class.no-error-space]="noErrorSpace">
  <mat-label class="dx-outer-label" *ngIf="outline === 'outer-label'">
    <ng-content select="[dxLabel]"></ng-content>
    <span *ngIf="required || ctrRequired" class="astrict">*</span>
  </mat-label>
  <mat-form-field appearance="outline" floatLabel="always">
    <mat-label *ngIf="outline !== 'outer-label'">
      <ng-content select="dx-label"></ng-content>
    </mat-label>
    <mat-select [id]="id" #multiSelect [(ngModel)]="value" [compareWith]="comparer"
      (ngModelChange)="inputChange($event) " [required]="required" multiple
      (selectionChange)="onDropDownChange($event.value)" [disabled]="disabled">
      <mat-select-trigger>
        <mat-chip-listbox aria-label="Fish selection">
          <mat-chip-option *ngFor="let data of value" [removable]="true" (removed)="onRemoveChip(data)">
            {{ data?.valueTt }}
            <button matChipRemove aria-label="'remove ' + keyword">
              <mat-icon>close</mat-icon>
            </button>
          </mat-chip-option>
        </mat-chip-listbox>
      </mat-select-trigger>

      <mat-option>
        <dx-mat-select-search #selectSearch [formControl]="searchCtrl" placeholderLabel="Search"
          noEntriesFoundLabel="no match found"></dx-mat-select-search>
      </mat-option>
      <div>
        <!-- groups -->
        <ng-container *ngIf="groups && groups?.length>0">
          <mat-optgroup *ngFor="let group of filteredGroups | async" [label]="group?.label">
            <mat-option *ngFor="let option of group?.options" [value]="option">
              <div class="item">
                <span>
                  {{option?.valueTt | transloco}}
                </span>
              </div>
            </mat-option>
          </mat-optgroup>
        </ng-container>
        <!--  -->
        <!-- options -->
        <ng-container *ngIf="options && options?.length>0">
          <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
            <div class="item">
              <span>
                {{option?.valueTt | transloco}}
              </span>
            </div>
          </mat-option>
        </ng-container>
        <!--  -->
        <div class="mat-option create-option-wrapper" *ngIf="createOption?.isShow"
          (click)="onClickCreateCustomOption()">
          <div class="item">
            <span class="align-material-icon-text">
              <span class="material-icons">add</span><span class="create-option-label">{{createOption?.label |
                transloco}}</span>
            </span>
          </div>
        </div>
      </div>
    </mat-select>
    <span matSuffix>
      <ng-content select="dx-suffix"></ng-content>
    </span>
    <mat-hint>
      <ng-content select="dx-hint"> </ng-content>
    </mat-hint>
    <mat-error>
      <ng-content select="dx-error"></ng-content>
    </mat-error>
  </mat-form-field>

</div>
